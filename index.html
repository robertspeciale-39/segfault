<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070a">
<title>SEGFAULT · CyberSpesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   CyberSpesh Design System v3
   Inter + JetBrains Mono · tokenized themes · 4/8 rhythm
   DO NOT hardcode colours. Every colour resolves through a token.
══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Type scale */
  --fs-2xs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-base: 15px; --fs-md: 16px;
  --fs-lg: 18px;  --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 34px; --fs-4xl: 44px;

  /* Spacing rhythm (4/8) */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

  /* Radii */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;

  /* Motion */
  --ease-out: cubic-bezier(.22,.8,.3,1);
  --dur-fast: 140ms;
  --dur: 200ms;

  /* Z-index scale */
  --z-atmos: 0; --z-content: 10; --z-sticky: 60; --z-overlay: 90; --z-toast: 100;
}

/* ══════════════════════════════════════════════════════
   THEMES — five, always in this order, matrix default
══════════════════════════════════════════════════════ */
body.matrix {
  --bg: #05070a;
  --surface-1: rgba(255,255,255,.026);
  --surface-2: rgba(255,255,255,.045);
  --surface-3: rgba(255,255,255,.07);
  --line: rgba(120,235,150,.16);
  --line-strong: rgba(120,235,150,.32);
  --primary: #35d67d;
  --primary-soft: rgba(53,214,125,.14);
  --accent: #6ef2a6;
  --glow-rgba: rgba(53,214,125,.20);
  --text: #cfe6d8; --text-2: #9dc0ad; --text-dim: #7a9d88; --text-bright: #eafff2;
  --danger: #ff7a7a;
  --u1: #35d67d; --u2: #6ef2a6; --u3: #d9e85a; --u4: #ffb454; --u5: #ff7a7a;
}
body.arctic {
  --bg: #04090f;
  --surface-1: rgba(255,255,255,.03);
  --surface-2: rgba(255,255,255,.05);
  --surface-3: rgba(255,255,255,.075);
  --line: rgba(120,200,235,.17);
  --line-strong: rgba(120,200,235,.34);
  --primary: #45b8d8;
  --primary-soft: rgba(69,184,216,.15);
  --accent: #9fe0f0;
  --glow-rgba: rgba(69,184,216,.20);
  --text: #cfe4ee; --text-2: #a3c1d1; --text-dim: #7fa0b2; --text-bright: #eefaff;
  --danger: #ff8a8a;
  --u1: #45b8d8; --u2: #7ce0e8; --u3: #8fe3b8; --u4: #ffc46b; --u5: #ff8a8a;
}
body.crimson {
  --bg: #0b0406;
  --surface-1: rgba(255,255,255,.03);
  --surface-2: rgba(255,255,255,.05);
  --surface-3: rgba(255,255,255,.075);
  --line: rgba(255,120,120,.17);
  --line-strong: rgba(255,120,120,.34);
  --primary: #f2555b;
  --primary-soft: rgba(242,85,91,.15);
  --accent: #ff9b8a;
  --glow-rgba: rgba(242,85,91,.20);
  --text: #f0d4d5; --text-2: #cb9c9f; --text-dim: #a87b7e; --text-bright: #fff0f0;
  --danger: #ff6b6b;
  --u1: #f2555b; --u2: #ff9366; --u3: #ffc247; --u4: #ff85a6; --u5: #d072d8;
}
body.tokyo {
  --bg: #0b0510;
  --surface-1: rgba(255,255,255,.03);
  --surface-2: rgba(255,255,255,.05);
  --surface-3: rgba(255,255,255,.075);
  --line: rgba(255,120,175,.17);
  --line-strong: rgba(255,120,175,.34);
  --primary: #ff5c9d;
  --primary-soft: rgba(255,92,157,.15);
  --accent: #6ee7f5;
  --glow-rgba: rgba(255,92,157,.20);
  --text: #f2d5e2; --text-2: #cfa1b6; --text-dim: #ad8195; --text-bright: #fff2f7;
  --danger: #ff7a7a;
  --u1: #ff5c9d; --u2: #6ee7f5; --u3: #ffd166; --u4: #a78bfa; --u5: #6ee7a5;
}
body.galaxy {
  --bg: #0a0718;
  --surface-1: rgba(255,255,255,.03);
  --surface-2: rgba(255,255,255,.05);
  --surface-3: rgba(255,255,255,.075);
  --line: rgba(190,150,255,.17);
  --line-strong: rgba(190,150,255,.34);
  --primary: #a97bf5;
  --primary-soft: rgba(169,123,245,.16);
  --accent: #d6b4ff;
  --glow-rgba: rgba(169,123,245,.22);
  --text: #ded3f2; --text-2: #b3a5cc; --text-dim: #8f81ab; --text-bright: #f6f0ff;
  --danger: #ff8fb0;
  --u1: #a97bf5; --u2: #6ee7f5; --u3: #ffd166; --u4: #ff8fb0; --u5: #6ee7a5;
}

/* Derived tokens — shared by every theme. Use --u1s..--u5s for tinted fills. */
body {
  --u1s: color-mix(in srgb, var(--u1) 18%, transparent);
  --u2s: color-mix(in srgb, var(--u2) 18%, transparent);
  --u3s: color-mix(in srgb, var(--u3) 18%, transparent);
  --u4s: color-mix(in srgb, var(--u4) 18%, transparent);
  --u5s: color-mix(in srgb, var(--u5) 18%, transparent);
}

/* ══════════════════════════════════════════════════════
   BASE
══════════════════════════════════════════════════════ */
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: 1.6;
  min-height: 100dvh;
  position: relative;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background var(--dur) var(--ease-out), color var(--dur) var(--ease-out);
}

::selection { background: var(--primary); color: var(--bg); }

:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* Atmosphere — ambient glow + faint grid, masked to the top of the page */
#matrix-rain {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: var(--z-atmos); opacity: .07; pointer-events: none;
}
.atmos {
  position: fixed; inset: 0; z-index: var(--z-atmos); pointer-events: none;
  background:
    radial-gradient(680px 460px at 82% -6%, var(--glow-rgba), transparent 68%),
    radial-gradient(560px 420px at 6% 62%, var(--glow-rgba), transparent 70%);
  opacity: .55;
}
.atmos::after {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  opacity: .30;
  -webkit-mask-image: radial-gradient(1100px 720px at 50% 0%, #000 30%, transparent 90%);
  mask-image: radial-gradient(1100px 720px at 50% 0%, #000 30%, transparent 90%);
}

.shell { position: relative; z-index: var(--z-content); display: grid;
         grid-template-rows: auto auto 1fr; min-height: 100dvh; }

/* ══════════════════════════════════════════════════════
   TOPBAR
══════════════════════════════════════════════════════ */
.topbar {
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border-bottom: 1px solid var(--line);
  padding: var(--sp-3) var(--sp-6);
  display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap;
  position: sticky; top: 0; z-index: var(--z-sticky);
}
.topbar::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
}
.brand { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; text-decoration: none; }
.brand-mark { width: 38px; height: 38px; flex-shrink: 0; display: block; border-radius: var(--r-sm); }
.brand-text { min-width: 0; }
.brand-title {
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-lg);
  letter-spacing: -0.022em; line-height: 1.2; color: var(--text-bright);
}
.brand-sub {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500;
  color: var(--primary); letter-spacing: .10em; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar-sep { flex: 1 1 auto; }
.topbar-tag {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500;
  color: var(--text-2); letter-spacing: .08em;
  border: 1px solid var(--line); background: var(--surface-1);
  padding: 5px 10px; border-radius: var(--r-sm); white-space: nowrap;
}

/* Theme switcher */
.theme-switcher {
  display: flex; align-items: center; gap: 3px; padding: 3px;
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-pill);
}
.theme-label {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500;
  color: var(--text-dim); letter-spacing: .10em; padding: 0 var(--sp-2) 0 var(--sp-3);
}
.theme-btn {
  font-family: var(--font-body); font-size: var(--fs-xs); font-weight: 600;
  color: var(--text-2); background: transparent; border: 0; border-radius: var(--r-pill);
  padding: 7px 12px; min-height: 32px; cursor: pointer; white-space: nowrap;
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.theme-btn:hover { color: var(--text-bright); background: var(--surface-2); }
.theme-btn.active { color: var(--bg); background: var(--primary); font-weight: 700; }

/* ══════════════════════════════════════════════════════
   NAV TABS (delete if the app is single-view)
══════════════════════════════════════════════════════ */
.navtabs {
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 0 var(--sp-6); display: flex; gap: var(--sp-1); overflow-x: auto;
  position: sticky; top: 68px; z-index: calc(var(--z-sticky) - 1);
}
.navtab {
  font-family: var(--font-display); font-size: var(--fs-md); font-weight: 600;
  letter-spacing: -0.014em; color: var(--text-2);
  padding: var(--sp-3) var(--sp-4); min-height: 46px;
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.navtab:hover { color: var(--text-bright); }
.navtab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }

.main { padding: var(--sp-8) var(--sp-6) var(--sp-12); display: none; }
.main.active { display: block; }

/* ══════════════════════════════════════════════════════
   COMPONENTS
══════════════════════════════════════════════════════ */
.panel {
  background: var(--surface-1); border: 1px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden; backdrop-filter: blur(2px);
}
.panel-hdr {
  padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-3); flex-wrap: wrap;
}
.panel-title {
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-lg);
  letter-spacing: -0.020em; line-height: 1.3; color: var(--text-bright);
}
.panel-body { padding: var(--sp-5); }

.pill {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: 4px 10px; border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
  letter-spacing: .06em; border: 1px solid; white-space: nowrap;
}
.badge {
  display: inline-block; padding: 2px 8px; border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .04em;
}

/* Stat cards */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: var(--sp-4); margin-bottom: var(--sp-6);
}
.stat-card {
  background: var(--surface-1); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--sp-5); backdrop-filter: blur(2px);
  transition: border-color var(--dur) var(--ease-out), background var(--dur) var(--ease-out);
}
.stat-card:hover { border-color: var(--line-strong); background: var(--surface-2); }
.stat-val {
  font-family: var(--font-display); font-size: var(--fs-4xl); font-weight: 800;
  line-height: 1; letter-spacing: -0.035em; font-variant-numeric: tabular-nums;
  margin-bottom: var(--sp-2);
}
.stat-label {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500;
  color: var(--text-dim); letter-spacing: .12em; text-transform: uppercase;
}

/* Layout helpers */
.two-col   { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-6); }
.three-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-6); }
.full-col  { margin-bottom: var(--sp-6); }

/* List rows — sidebar items, category buttons, matched pairs */
.row-list { display: flex; flex-direction: column; gap: var(--sp-2); }
.row-item {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--r-md);
  cursor: pointer; min-height: 56px; width: 100%; text-align: left;
  font-family: var(--font-body); font-size: var(--fs-base); color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.row-item:hover { background: var(--surface-3); border-color: var(--line-strong); transform: translateX(2px); }
.row-item.active { border-color: var(--primary); background: var(--primary-soft); }
.row-title {
  font-family: var(--font-display); font-weight: 650; font-size: var(--fs-md);
  letter-spacing: -0.015em; line-height: 1.35; color: var(--text-bright);
}
.row-meta {
  font-family: var(--font-mono); font-size: var(--fs-2xs);
  color: var(--text-dim); letter-spacing: .02em; margin-top: 2px;
}

/* Search + filter bar */
.filter-bar { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); flex-wrap: wrap; align-items: center; }
.filter-bar input[type="text"] {
  flex: 1; min-width: 220px; min-height: 44px;
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 0 var(--sp-4); color: var(--text-bright);
  font-family: var(--font-body); font-size: var(--fs-base); outline: none;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.filter-bar input::placeholder { color: var(--text-dim); }
.filter-bar input:focus { border-color: var(--primary); background: var(--surface-2); }
.filter-btn {
  background: var(--surface-1); border: 1px solid var(--line); color: var(--text-2);
  padding: 0 var(--sp-4); min-height: 44px; border-radius: var(--r-sm);
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600; cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.filter-btn:hover { color: var(--text-bright); background: var(--surface-2); border-color: var(--line-strong); }
.filter-btn.active { background: var(--primary); border-color: var(--primary); color: var(--bg); font-weight: 700; }

/* Primary action button */
.btn {
  font-family: var(--font-body); font-size: var(--fs-base); font-weight: 650;
  min-height: 44px; padding: 0 var(--sp-5); border-radius: var(--r-sm); cursor: pointer;
  background: var(--primary); border: 1px solid var(--primary); color: var(--bg);
  transition: filter var(--dur-fast) var(--ease-out);
}
.btn:hover { filter: brightness(1.12); }
.btn-ghost { background: var(--surface-1); border-color: var(--line); color: var(--text-bright); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--line-strong); filter: none; }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); }
table.cs-table { width: 100%; border-collapse: collapse; }
.cs-table th {
  background: color-mix(in srgb, var(--bg) 92%, var(--surface-3));
  padding: var(--sp-3) var(--sp-4); text-align: left;
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
  color: var(--text-2); letter-spacing: .12em; text-transform: uppercase;
  border-bottom: 1px solid var(--line-strong); position: sticky; top: 0; z-index: 2;
}
.cs-table td {
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line);
  vertical-align: top; font-size: var(--fs-sm); line-height: 1.6;
}
.cs-table tr:hover td { background: var(--surface-2); }

/* Drill / quiz overlay — delete if drill mode is off */
.overlay {
  position: fixed; inset: 0; z-index: var(--z-overlay);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: none; align-items: center; justify-content: center; padding: var(--sp-4);
}
.overlay.open { display: flex; }
.overlay-card {
  width: min(620px, 100%); background: var(--surface-2);
  border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: var(--sp-6);
}
.choice {
  display: block; width: 100%; text-align: left; margin-bottom: var(--sp-2);
  padding: var(--sp-3) var(--sp-4); min-height: 48px;
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-md);
  color: var(--text); font-family: var(--font-body); font-size: var(--fs-base); cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.choice:hover { border-color: var(--line-strong); background: var(--surface-2); }
/* Correct/wrong states pair a colour with a glyph — never colour alone */
.choice.correct { border-color: var(--u1); background: var(--u1s); color: var(--text-bright); }
.choice.correct::after { content: ' ✓'; font-weight: 700; }
.choice.wrong   { border-color: var(--danger); background: var(--u5s); color: var(--text-bright); }
.choice.wrong::after { content: ' ✕'; font-weight: 700; }

/* Scrollbar */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--r-pill); border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ══════════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════════ */
@media (max-width: 1080px) {
  .theme-label { display: none; }
  .topbar-tag { display: none; }
}
@media (max-width: 820px) {
  .topbar { padding: var(--sp-3) var(--sp-4); }
  .navtabs { padding: 0 var(--sp-4); top: 0; position: static; }
  .main { padding: var(--sp-6) var(--sp-4) var(--sp-10); }
  .theme-switcher { order: 5; width: 100%; justify-content: space-between; }
  .theme-btn { flex: 1; text-align: center; padding: 7px 4px; }
  .brand-title { font-size: var(--fs-md); }
  .stat-val { font-size: var(--fs-3xl); }
  .two-col, .three-col { grid-template-columns: 1fr; }
}

/* ══════════════════════════════════════════════════════
   REDUCED MOTION / PRINT
══════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  #matrix-rain, .atmos { display: none; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
@media print {
  .topbar, .navtabs, #matrix-rain, .atmos, .overlay { display: none !important; }
  body { background: #fff; color: #000; }
  .main { display: block !important; }
  .panel, .stat-card { border-color: #ccc; background: #fff; break-inside: avoid; }
  .panel-title, .stat-val, .row-title { color: #000; }
}
/* ══════════════════════════════════════════════════════
   SEGFAULT — app components (tokens only)
══════════════════════════════════════════════════════ */
/* Shell fix: stop nowrap brand text from widening the page on phones */
.shell { grid-template-columns: minmax(0, 1fr); }

.muted { color: var(--text-2); }
.mono  { font-family: var(--font-mono); }
.kicker {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--primary);
}
h1.page-title {
  font-family: var(--font-display); font-size: var(--fs-3xl); font-weight: 800;
  letter-spacing: -0.03em; line-height: 1.15; color: var(--text-bright); margin: var(--sp-1) 0 var(--sp-2);
}
h2.sec-title {
  font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 700;
  letter-spacing: -0.022em; line-height: 1.25; color: var(--text-bright);
}
h3.sub-title {
  font-family: var(--font-display); font-size: var(--fs-md); font-weight: 700;
  letter-spacing: -0.015em; color: var(--text-bright); margin-bottom: var(--sp-2);
}
.lede { max-width: 72ch; color: var(--text-2); margin-bottom: var(--sp-6); }
.btn-row { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-4); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: grayscale(1); }

/* ── Level map ─────────────────────────────── */
.map-top { align-items: start; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--sp-4); margin-bottom: var(--sp-6); }
.pass-form { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.pass-form input, .field-input {
  flex: 1; min-width: 0; min-height: 44px; padding: 0 var(--sp-4);
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-sm);
  color: var(--text-bright); font-family: var(--font-mono); font-size: var(--fs-base);
  letter-spacing: .06em; text-transform: uppercase; outline: none;
}
.pass-form input:focus { border-color: var(--primary); background: var(--surface-2); }
.pass-msg { font-family: var(--font-mono); font-size: var(--fs-xs); margin-top: var(--sp-2); min-height: 1.6em; }
.pass-msg.ok { color: var(--u3); }
.pass-msg.bad { color: var(--danger); }
.world-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--sp-4); }
.world-num { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); letter-spacing: .12em; }
.lvl-state { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: .08em; white-space: nowrap; }
.lvl-state.cleared { color: var(--u3); }
.lvl-state.open { color: var(--primary); }
.lvl-state.locked { color: var(--text-dim); }
.row-item[disabled] { cursor: not-allowed; opacity: .55; }
.row-item[disabled]:hover { transform: none; background: var(--surface-2); border-color: var(--line); }
.lvl-id { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim); min-width: 3.2em; }

/* ── Level screen ──────────────────────────── */
.lv-head { display: flex; align-items: flex-start; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-4); }
.lv-head .grow { flex: 1 1 320px; min-width: 0; }
.lv-title { font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -0.028em; line-height: 1.2; color: var(--text-bright); }
.stepper { display: flex; gap: var(--sp-2); flex-wrap: wrap; list-style: none; margin-bottom: var(--sp-4); }
.stepper li {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .1em;
  padding: var(--sp-1) var(--sp-3); border: 1px solid var(--line); border-radius: var(--r-pill); color: var(--text-dim);
}
.stepper li.done { color: var(--text-2); border-color: var(--line-strong); }
.stepper li.done::before { content: '✓ '; }
.stepper li[aria-current="step"] { color: var(--bg); background: var(--primary); border-color: var(--primary); }
.lv-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
.diagram-wrap { position: sticky; top: 132px; max-height: calc(100dvh - 148px); overflow-y: auto; border-radius: var(--r-lg); }
.diagram { padding: var(--sp-4); }
.caption {
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--r-md);
  padding: var(--sp-4); font-size: var(--fs-md); color: var(--text-bright); min-height: 7em;
}
.step-count { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); letter-spacing: .1em; margin-bottom: var(--sp-2); }
.needs { list-style: none; display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-4); }
.needs li {
  font-size: var(--fs-sm); padding: var(--sp-2) var(--sp-3); border-left: 3px solid var(--primary);
  background: var(--surface-2); border-radius: 0 var(--r-sm) var(--r-sm) 0;
}
.ctrl-sec { margin-bottom: var(--sp-5); }
.ctrl-help { font-size: var(--fs-sm); color: var(--text-2); margin-bottom: var(--sp-3); }
.ctrl-row {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--sp-2) var(--sp-3);
  align-items: center; padding: var(--sp-2) 0; border-bottom: 1px solid var(--line);
}
.ctrl-row:last-child { border-bottom: 0; }
.ctrl-label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-bright); line-height: 1.35; }
.ctrl-meta { display: block; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); font-weight: 500; letter-spacing: .04em; margin-top: 2px; }
.ctrl-row select {
  width: 100%; min-height: 44px; padding: 0 var(--sp-3);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm);
  color: var(--text-bright); font-family: var(--font-body); font-size: var(--fs-sm);
}
.ctrl-row select option { background: var(--bg); color: var(--text-bright); }
.range-wrap { display: flex; align-items: center; gap: var(--sp-3); min-height: 44px; }
.range-wrap input[type="range"] { flex: 1; min-width: 0; accent-color: var(--primary); height: 44px; }
.range-out { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 700; color: var(--text-bright); min-width: 2.5em; text-align: right; font-variant-numeric: tabular-nums; }
.hint-box { margin-top: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
.hint-item { font-size: var(--fs-sm); padding: var(--sp-2) var(--sp-3); border: 1px dashed var(--line-strong); border-radius: var(--r-sm); color: var(--text); }
.hint-item b { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--u4); letter-spacing: .08em; margin-right: var(--sp-2); }

.log {
  font-family: var(--font-mono); font-size: var(--fs-xs); line-height: 1.6;
  background: color-mix(in srgb, var(--bg) 70%, transparent); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: var(--sp-3); max-height: 340px; overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--sp-1);
}
.log-line { color: var(--text); }
.log-line.ok::before   { content: '[ OK ] '; color: var(--u3); font-weight: 700; }
.log-line.bad::before  { content: '[FAIL] '; color: var(--danger); font-weight: 700; }
.log-line.alert::before { content: '[ !! ] '; color: var(--u4); font-weight: 700; }
.log-line.info::before { content: '[ .. ] '; color: var(--text-dim); font-weight: 700; }
.result { margin-top: var(--sp-4); padding: var(--sp-4); border-radius: var(--r-md); border: 1px solid; }
.result.pass { border-color: var(--u3); background: var(--u3s); }
.result.fail { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.result-title { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-lg); color: var(--text-bright); margin-bottom: var(--sp-2); }
.result ul { padding-left: var(--sp-5); font-size: var(--fs-sm); }
.result li + li { margin-top: var(--sp-1); }
.why { margin-top: var(--sp-3); font-size: var(--fs-sm); color: var(--text); padding: var(--sp-3); background: var(--surface-2); border-radius: var(--r-sm); }
.code-box {
  margin-top: var(--sp-4); padding: var(--sp-4); border: 1px solid var(--primary); border-radius: var(--r-md);
  background: var(--primary-soft); text-align: center;
}
.code-val { font-family: var(--font-mono); font-size: var(--fs-2xl); font-weight: 700; color: var(--text-bright); letter-spacing: .08em; overflow-wrap: anywhere; }

/* ── Diagram pieces ────────────────────────── */
.zrow { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: stretch; }
.zone {
  flex: 1 1 170px; min-width: 0; padding: var(--sp-3);
  border: 1px dashed var(--line-strong); border-radius: var(--r-md); background: var(--surface-1);
}
.zone.solid { border-style: solid; }
.zone-hdr { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
.zone-name { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 700; color: var(--text-bright); letter-spacing: .04em; }
.zone-tag { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); letter-spacing: .06em; }
.zone-devs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--sp-2); margin-top: var(--sp-2); }
.zone-devs .dev { margin-top: 0; }
.zone-empty { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); margin-top: var(--sp-2); }
.wall {
  flex: 0 0 40px; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--u4); border-radius: var(--r-sm); background: var(--u4s);
}
.wall span { writing-mode: vertical-rl; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; color: var(--text-bright); letter-spacing: .12em; padding: var(--sp-2) 0; }
.dev {
  display: flex; flex-direction: column; margin-top: var(--sp-2); padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2);
  transition: border-color var(--dur) var(--ease-out), background var(--dur) var(--ease-out);
}
.dev-kind { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); letter-spacing: .08em; }
.dev-name { font-size: var(--fs-sm); font-weight: 600; color: var(--text-bright); line-height: 1.3; }
.dev-ip { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-2); }
.mk { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .06em; margin-top: 2px; }
.m-bad  { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 16%, transparent); }
.m-bad  .mk, .mk.m-bad-t { color: var(--danger); }
.m-good { border-color: var(--u3); background: var(--u3s); }
.m-good .mk, .mk.m-good-t { color: var(--u3); }
.m-warn { border-color: var(--u4); background: var(--u4s); }
.m-warn .mk, .mk.m-warn-t { color: var(--u4); }

/* Switch */
.sw { border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: var(--sp-3); background: var(--surface-2); }
.sw-label { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); letter-spacing: .12em; margin-bottom: var(--sp-2); }
.sw-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-2); }
.port {
  border: 2px solid var(--line); border-radius: var(--r-sm); padding: var(--sp-2);
  background: var(--surface-1); min-width: 0; display: flex; flex-direction: column; gap: 2px;
}
.port-n { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); }
.port-v { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .04em; }
.port-d { font-size: var(--fs-xs); color: var(--text-bright); line-height: 1.3; overflow-wrap: anywhere; }
.v-1   { border-color: var(--line-strong); }  .v-1 .port-v { color: var(--text-2); }
.v-10  { border-color: var(--u1); }          .v-10 .port-v { color: var(--u1); }
.v-20  { border-color: var(--u3); }          .v-20 .port-v { color: var(--u3); }
.v-30  { border-color: var(--u4); }          .v-30 .port-v { color: var(--u4); }
.v-off { border-style: dashed; opacity: .7; } .v-off .port-v { color: var(--text-dim); }
.port.m-bad, .port.m-good, .port.m-warn { border-width: 2px; }
.legend { display: flex; gap: var(--sp-3); flex-wrap: wrap; margin-top: var(--sp-3); font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-2); }
.legend span::before { content: '■ '; }
.legend .l10::before { color: var(--u1); } .legend .l20::before { color: var(--u3); } .legend .l30::before { color: var(--u4); }

/* MAC table meter */
.cam { margin-top: var(--sp-3); }
.cam-head { display: flex; justify-content: space-between; gap: var(--sp-2); flex-wrap: wrap; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-2); margin-bottom: var(--sp-2); }
.cam-cells { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
.cam-cell { height: 22px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface-1); }
.cam-cell.legit { background: var(--u3s); border-color: var(--u3); }
.cam-cell.fake  { background: color-mix(in srgb, var(--danger) 30%, transparent); border-color: var(--danger); }
.cam-mode { margin-top: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; }

/* Flow rules list */
.flows { list-style: none; display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-3); }
.flows li {
  display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap;
  padding: var(--sp-2) var(--sp-3); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2);
}
.flow-path { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-bright); flex: 1 1 200px; }
.flow-act { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .08em; padding: 2px var(--sp-2); border-radius: var(--r-sm); border: 1px solid var(--line-strong); }
.flow-act.allow { color: var(--u3); }
.flow-act.deny  { color: var(--danger); }

/* ── Practice drills ───────────────────────── */
.drill-top { display: flex; gap: var(--sp-3); flex-wrap: wrap; align-items: center; margin-bottom: var(--sp-4); }
.drill-stat { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-2); letter-spacing: .06em; border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); }
.drill-stat b { color: var(--text-bright); font-variant-numeric: tabular-nums; }
.prompt-card {
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--r-lg);
  padding: var(--sp-6); margin-bottom: var(--sp-4);
}
.prompt-text { font-size: var(--fs-lg); color: var(--text-bright); line-height: 1.5; }
.ip-pair { display: grid; gap: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-xl); color: var(--text-bright); font-variant-numeric: tabular-nums; }
.ip-pair .mask { font-size: var(--fs-md); color: var(--primary); }
.ip-net { text-decoration: underline; text-decoration-color: var(--u4); text-underline-offset: 4px; text-decoration-thickness: 2px; color: var(--u4); }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--sp-2); }
.choice-grid .choice { margin-bottom: 0; }
.choice[disabled] { cursor: default; }
.choice.ruled { opacity: .35; text-decoration: line-through; }
.feedback { margin-top: var(--sp-4); padding: var(--sp-4); border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface-1); font-size: var(--fs-sm); }
.feedback .fb-title { font-weight: 800; color: var(--text-bright); margin-bottom: var(--sp-1); }
.kbd-note { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); margin-top: var(--sp-3); }

@media (max-width: 900px) {
  .lv-layout, .map-top { grid-template-columns: minmax(0, 1fr); }
  .diagram-wrap { position: static; max-height: none; }
}
@media (max-width: 600px) {
  .sw-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .zrow.walls { flex-direction: column; }
  .zrow.walls .wall { flex: 0 0 auto; min-height: 32px; }
  .zrow.walls .wall span { writing-mode: horizontal-tb; padding: var(--sp-1) 0; }
  .ctrl-row { grid-template-columns: minmax(0, 1fr); }
  .cam-cell { height: 16px; }
  .lv-title { font-size: var(--fs-xl); }
  h1.page-title { font-size: var(--fs-2xl); }
}
@media print {
  .diagram-wrap { position: static; }
  .btn, .btn-row, .pass-form { display: none !important; }
}

</style>
</head>
<body class="matrix">

<canvas id="matrix-rain" aria-hidden="true"></canvas>
<div class="atmos" aria-hidden="true"></div>

<div class="shell">

// ══════════════════════════════════════════
//  TAB SWITCHER (delete if single-view)
// ══════════════════════════════════════════
function switchTab(name, btn) {
  document.querySelectorAll('.main').forEach(m => m.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('.navtab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

// ══════════════════════════════════════════
//  MATRIX RAIN — repalettes itself per theme
// ══════════════════════════════════════════
(function(){
  const canvas = document.getElementById('matrix-rain');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF<>{}[]|/\\';
  let cols, drops;
  function resize() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 16);
    drops = Array.from({length: cols}, () => Math.random() * -50);
  }
  resize();
  window.addEventListener('resize', resize);
  let PAL = {bg: '#05070a', primary: '#35d67d', bright: '#eafff2'};
  window.csRefreshRainPalette = function () {
    const cs = getComputedStyle(document.body);
    PAL = {
      bg:      cs.getPropertyValue('--bg').trim()          || PAL.bg,
      primary: cs.getPropertyValue('--primary').trim()     || PAL.primary,
      bright:  cs.getPropertyValue('--text-bright').trim() || PAL.bright
    };
  };
  window.csRefreshRainPalette();
  function draw() {
    ctx.globalAlpha = 0.18; ctx.fillStyle = PAL.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1; ctx.font = '13px JetBrains Mono, monospace';
    drops.forEach((y, i) => {
      const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
      ctx.fillStyle = Math.random() > 0.96 ? PAL.bright : PAL.primary;
      ctx.fillText(ch, i * 16, y * 16);
      if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 0.5 + Math.random() * 0.5;
    });
  }
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(draw, 50);
})();

// ══════════════════════════════════════════
//  THEME CONTROLLER — persists across apps
// ══════════════════════════════════════════
const CS_THEMES = ['matrix', 'arctic', 'crimson', 'tokyo', 'galaxy'];

function csSetTheme(name, persist) {
  if (!CS_THEMES.includes(name)) name = 'matrix';
  document.body.classList.remove(...CS_THEMES);
  document.body.classList.add(name);
  document.querySelectorAll('.theme-btn').forEach(b => {
    const on = b.dataset.theme === name;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(document.body).getPropertyValue('--bg').trim();
  if (window.csRefreshRainPalette) window.csRefreshRainPalette();
  if (persist !== false) { try { localStorage.setItem('cs_theme', name); } catch (e) {} }
}

(function initTheme() {
  let saved = 'matrix';
  try { saved = localStorage.getItem('cs_theme') || 'matrix'; } catch (e) {}
  csSetTheme(saved, false);
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.addEventListener('click', () => csSetTheme(b.dataset.theme));
  });
})();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEP_MS = RM ? 0 : 550;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');

const D = (id, name, kind, extra) => Object.assign({ id, name, kind }, extra || {});

function devChip(d, m) {
  const mk = m && MARK[m];
  return `<div class="dev ${mk ? mk[0] : ''}" data-dev="${d.id}">
    <span class="dev-kind">${esc(d.kind)}</span>
    <span class="dev-name">${esc(d.name)}</span>

    ${mk ? `<span class="mk">${mk[1]}</span>` : ''}
  </div>`;

// Malware spread inside a segment; crossing a boundary only if allow(fromZone,toZone)
function spread(devs, place, origin, allow, verb, protect) {
  const steps = [];
  const o = devs.find(d => d.id === origin);
  const oz = place[origin];
  steps.push({ t: `${o.name} ${verb || 'runs the malware'}.`, cls: 'alert', marks: { [origin]: 'origin' } });
  devs.forEach(d => {
    if (d.id === origin || d.fixed) return;
    const z = place[d.id];
    const bad = !protect || protect.includes(d.id);
    if (z === oz) steps.push({ t: `Spreads to ${d.name} (same segment).`, cls: bad ? 'bad' : 'alert', marks: { [d.id]: 'hit' } });
    else if (allow && allow(oz, z)) steps.push({ t: `Reaches ${d.name}: the firewall allows that flow.`, cls: 'bad', marks: { [d.id]: 'hit' } });
    else steps.push({ t: `${d.name}: blocked at the segment boundary.`, cls: 'ok', marks: { [d.id]: 'blocked' } });
  });
  return steps;
}
const hitIds = steps => { const s = new Set(); steps.forEach(x => Object.entries(x.marks || {}).forEach(([k, v]) => { if (v === 'hit' || v === 'origin') s.add(k); })); return s; };
const allTo = (ids, v) => Object.fromEntries(ids.map(i => [i, v]));

const BEST = { subnet: 0, tool: 0, myth: 0 };
const mult = streak => Math.min(5, 1 + Math.floor(streak / 3));

/* ── Same Subnet? ─────────────────────── */
function genSubnetQ() {
  const bases = [[10, 0], [10, 20], [172, 16], [192, 168]];
  const r = n => Math.floor(Math.random() * n);
  const mask = Math.random() < 0.72 ? 24 : 16;
  const b = pick(bases);
  let a, c, same;
  if (mask === 24) {
    const o3 = 1 + r(9); const roll = Math.random();
    a = [b[0], b[1], o3, 2 + r(250)];
    if (roll < 0.42) { same = true; c = [b[0], b[1], o3, 2 + r(250)]; if (c[3] === a[3]) c[3] = (a[3] % 250) + 3; }
    else if (roll < 0.72) { same = false; c = [b[0], b[1], o3 * 10, Math.random() < 0.6 ? a[3] : 2 + r(250)]; }
    else if (roll < 0.88) { same = false; c = [b[0], b[1], o3 + 1, a[3]]; }
    else { same = false; c = [b[0], b[1], a[3] % 250 || 7, o3]; if (c[2] === a[2]) c[2] = a[2] + 2; }
  } else {
    a = [b[0], b[1], r(200), 2 + r(250)];
    if (Math.random() < 0.55) { same = true; c = [b[0], b[1], (a[2] + 10 + r(40)) % 255, 2 + r(250)]; }
    else { same = false; c = [b[0], b[0] === 192 ? 169 : b[1] + 1 + r(5), a[2], a[3]]; }
  }
  if (Math.random() < 0.5) [a, c] = [c, a];
  const maskTxt = Math.random() < 0.5 ? '/' + mask : (mask === 24 ? '255.255.255.0' : '255.255.0.0');
  return { a, c, mask, maskTxt, same };
}
const fmtIP = (ip, mask, hl) => {
  const n = mask / 8;
  return hl ? `<span class="ip-net">${ip.slice(0, n).join('.')}</span>.${ip.slice(n).join('.')}` : ip.join('.');
};
const SN = { on: false, score: 0, streak: 0, n: 0, right: 0, hintsLeft: 3, hl: false, q: null, answered: false, t: 60, tick: null };
function renderSubnetIntro() {
  $('#drill-subnet').innerHTML = `<div class="kicker">PRACTICE · SUBNETTING</div><h1 class="page-title">Same Subnet?</h1>
    <p class="lede">Two addresses, one mask. Are they on the same subnet? 60 seconds, 10 points per answer, and a streak multiplier every 3 in a row (up to ×5). Up to 3 hints per round: each one underlines the network part and halves that answer's points.</p>
    <div class="prompt-card"><p class="prompt-text">The rule: the mask tells you how many octets name the network. <b>/24</b> (255.255.255.0) = first three. <b>/16</b> (255.255.0.0) = first two. If those match, same subnet.</p></div>
    <div class="btn-row"><button class="btn" id="sn-start" type="button">Start round ▶</button></div>
    ${BEST.subnet ? `<p class="kbd-note">Session best: ${BEST.subnet}</p>` : ''}`;
  $('#sn-start').addEventListener('click', startSubnet);
}
function startSubnet() {
  Object.assign(SN, { on: true, score: 0, streak: 0, n: 0, right: 0, hintsLeft: 3, t: 60 });
  nextSubnetQ();
  clearInterval(SN.tick);
  SN.tick = setInterval(() => { SN.t--; const el = $('#sn-t'); if (el) el.textContent = SN.t; if (SN.t <= 0) endSubnet(); }, 1000);
}
function nextSubnetQ() { SN.q = genSubnetQ(); SN.hl = false; SN.answered = false; drawSubnet(); }
function drawSubnet() {
  const q = SN.q;
  $('#drill-subnet').innerHTML = `<div class="drill-top">
      <span class="drill-stat">TIME <b id="sn-t">${SN.t}</b>s</span><span class="drill-stat">SCORE <b>${SN.score}</b></span>
      <span class="drill-stat">STREAK <b>${SN.streak}</b> · ×${mult(SN.streak)}</span><span class="drill-stat">HINTS <b>${SN.hintsLeft}</b></span></div>
    <div class="prompt-card"><div class="ip-pair" aria-live="polite"><span>${fmtIP(q.a, q.mask, SN.hl)}</span><span>${fmtIP(q.c, q.mask, SN.hl)}</span><span class="mask">mask ${q.maskTxt}</span></div></div>
    <div class="choice-grid"><button class="choice" type="button" data-v="1">1 · Same subnet</button><button class="choice" type="button" data-v="0">2 · Different subnets</button></div>
    <div class="btn-row"><button class="btn btn-ghost" id="sn-hint" type="button" ${SN.hintsLeft <= 0 || SN.hl || SN.answered ? 'disabled' : ''}>${SN.hintsLeft <= 0 ? 'No hints left' : 'Hint: show network part'}</button></div>
    <div id="sn-fb"></div><p class="kbd-note">Keys: 1 = same · 2 = different · H = hint · Enter = next</p>`;
  document.querySelectorAll('#drill-subnet .choice').forEach(b => b.addEventListener('click', () => answerSubnet(b.dataset.v === '1')));
  $('#sn-hint').addEventListener('click', subnetHint);
}
function subnetHint() { if (SN.hintsLeft > 0 && !SN.hl && !SN.answered) { SN.hintsLeft--; SN.hl = true; drawSubnet(); } }
function answerSubnet(v) {
  if (SN.answered || !SN.on) return;
  SN.answered = true; SN.n++;
  const q = SN.q, ok = v === q.same, n = q.mask / 8;
  if (ok) { SN.right++; SN.streak++; SN.score += Math.round(10 * mult(SN.streak) / (SN.hl ? 2 : 1)); } else SN.streak = 0;
  SN.hl = true; drawSubnet();
  document.querySelectorAll('#drill-subnet .choice').forEach(b => { b.disabled = true; if ((b.dataset.v === '1') === q.same) b.classList.add('correct'); else if ((b.dataset.v === '1') === v) b.classList.add('wrong'); });
  $('#sn-fb').innerHTML = `<div class="feedback"><div class="fb-title">${ok ? '✓ Correct' : '✕ Not quite'}</div>
    With ${q.maskTxt}, the network is the first ${n === 3 ? 'three' : 'two'} octets: <span class="mono">${q.a.slice(0, n).join('.')}</span> vs <span class="mono">${q.c.slice(0, n).join('.')}</span>. ${q.same ? 'They match, so same subnet.' : 'They differ, so different subnets.'}
    <div class="btn-row"><button class="btn" id="sn-next" type="button">Next →</button></div></div>`;
  $('#sn-next').addEventListener('click', nextSubnetQ); $('#sn-next').focus();
}
function endSubnet() {
  clearInterval(SN.tick); SN.on = false;
  BEST.subnet = Math.max(BEST.subnet, SN.score);
  $('#drill-subnet').innerHTML = `<div class="kicker">ROUND OVER</div><h1 class="page-title">${SN.score} points</h1>
    <div class="stat-grid"><div class="stat-card"><div class="stat-val">${SN.right}/${SN.n}</div><div class="stat-label">Correct</div></div><div class="stat-card"><div class="stat-val">${BEST.subnet}</div><div class="stat-label">Session best</div></div></div>
    <div class="btn-row"><button class="btn" id="sn-again" type="button">Play again ▶</button></div>`;
  $('#sn-again').addEventListener('click', startSubnet); $('#sn-again').focus();
}

    const q = Q.deck[Q.i];
    el().innerHTML = `<div class="drill-top"><span class="drill-stat">CARD <b>${Q.i + 1}</b>/10</span><span class="drill-stat">SCORE <b>${Q.score}</b></span>
      <span class="drill-stat">STREAK <b>${Q.streak}</b> · ×${mult(Q.streak)}</span>${cfg.hints ? `<span class="drill-stat">HINTS <b>${Q.hintsLeft}</b></span>` : ''}</div>
      <div class="prompt-card"><p class="prompt-text" aria-live="polite">${esc(q[0])}</p></div>
      <div class="choice-grid">${cfg.choices.map((c, i) => `<button class="choice ${Q.ruled.includes(i) ? 'ruled' : ''}" type="button" data-i="${i}" ${Q.ruled.includes(i) ? 'disabled' : ''}>${i + 1} · ${esc(c)}</button>`).join('')}</div>
      ${cfg.hints ? `<div class="btn-row"><button class="btn btn-ghost" id="${cfg.id}-hint" type="button" ${Q.hintsLeft <= 0 || Q.ruled.length || Q.answered ? 'disabled' : ''}>${Q.hintsLeft <= 0 ? 'No hints left' : 'Hint: rule out 2'}</button></div>` : ''}
      <div id="${cfg.id}-fb"></div><p class="kbd-note">Keys: ${cfg.choices.map((_, i) => i + 1).join(' / ')} = answer${cfg.hints ? ' · H = hint' : ''} · Enter = next</p>`;
    el().querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => answer(+b.dataset.i)));
    const hb = $(`#${cfg.id}-hint`); if (hb) hb.addEventListener('click', hint);
  }
  function hint() {
    if (!cfg.hints || Q.hintsLeft <= 0 || Q.ruled.length || Q.answered) return;
    const a = cfg.ans(Q.deck[Q.i]);
    Q.ruled = shuffle(cfg.choices.map((_, i) => i).filter(i => i !== a)).slice(0, 2); Q.hintsLeft--; render();
  }
  function answer(i) {
    if (Q.answered || !Q.on || Q.ruled.includes(i)) return;
    Q.answered = true;
    const q = Q.deck[Q.i], a = cfg.ans(q), ok = i === a;
    if (ok) { Q.right++; Q.streak++; Q.score += Math.round(10 * mult(Q.streak) / (Q.ruled.length ? 2 : 1)); } else Q.streak = 0;
    el().querySelectorAll('.choice').forEach(b => { const bi = +b.dataset.i; b.disabled = true; if (bi === a) b.classList.add('correct'); else if (bi === i) b.classList.add('wrong'); });
    const hb = $(`#${cfg.id}-hint`); if (hb) hb.disabled = true;
    const last = Q.i === 9;
    $(`#${cfg.id}-fb`).innerHTML = `<div class="feedback"><div class="fb-title">${ok ? '✓ Correct' : '✕ Not quite: ' + esc(cfg.choices[a])}</div>${esc(q[2])}
      <div class="btn-row"><button class="btn" id="${cfg.id}-next" type="button">${last ? 'See results →' : 'Next →'}</button></div></div>`;
    $(`#${cfg.id}-next`).addEventListener('click', () => { if (last) end(); else { Q.i++; draw(); } });
    $(`#${cfg.id}-next`).focus();
  }
  function end() {
    Q.on = false; BEST[cfg.id] = Math.max(BEST[cfg.id], Q.score);
    el().innerHTML = `<div class="kicker">ROUND OVER</div><h1 class="page-title">${Q.score} points</h1>
      <div class="stat-grid"><div class="stat-card"><div class="stat-val">${Q.right}/10</div><div class="stat-label">Correct</div></div><div class="stat-card"><div class="stat-val">${BEST[cfg.id]}</div><div class="stat-label">Session best</div></div></div>
      <div class="btn-row"><button class="btn" id="${cfg.id}-again" type="button">Play again ▶</button></div>`;
    $(`#${cfg.id}-again`).addEventListener('click', start); $(`#${cfg.id}-again`).focus();
  }
  return { intro, key(k) {
    if (!Q.on) return;
    const n = parseInt(k, 10);
    if (n >= 1 && n <= cfg.choices.length) answer(n - 1);
    else if ((k === 'h' || k === 'H') && cfg.hints) hint();
    else if (k === 'Enter') { const nb = $(`#${cfg.id}-next`); if (nb) nb.click(); }
  } };
}
const TOOL = makeQuiz({ id: 'tool', mount: '#drill-tool', kicker: 'PRACTICE · IDENTIFY THE TECHNIQUE', title: 'Pick the Tool',
  lede: 'Read the scenario and pick the segmentation technique it describes. This is the skill AP exam questions test most. Ten cards a round, streak multiplier every 3 in a row, and up to 3 hints that rule out two wrong answers (and halve that card\'s points).',
  bank: TOOL_Q, choices: TOOLS, hints: true, ans: q => q[1] });
const MYTH = makeQuiz({ id: 'myth', mount: '#drill-myth', kicker: 'PRACTICE · EXAM TRAPS', title: 'Myth or Fact',
  lede: 'The statements AP questions like to twist. Decide whether each one is a myth or a fact. Ten cards a round, streak multiplier every 3 in a row.',
  bank: MYTH_Q.map(q => [q[0], q[1] ? 1 : 0, q[2]]), choices: ['Myth', 'Fact'], hints: false, ans: q => q[1] });

// ══════════════════════════════════════════
//  TABS + KEYBOARD
// ══════════════════════════════════════════
let ACTIVE_TAB = 'campaign';
const _switchTab = switchTab;
switchTab = function (name, btn) {
  _switchTab(name, btn);
  document.querySelectorAll('.navtab').forEach(b => b.setAttribute('aria-selected', b.classList.contains('active') ? 'true' : 'false'));
  if (ACTIVE_TAB === 'subnet' && name !== 'subnet' && SN.on) { clearInterval(SN.tick); SN.on = false; renderSubnetIntro(); }
  ACTIVE_TAB = name;
};
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (ACTIVE_TAB === 'subnet' && SN.on) {
    if (e.key === '1') answerSubnet(true);
    else if (e.key === '2') answerSubnet(false);
    else if (e.key === 'h' || e.key === 'H') subnetHint();
    else if (e.key === 'Enter') { const nb = $('#sn-next'); if (nb && document.activeElement !== nb) { e.preventDefault(); nb.click(); } }
  } else if (ACTIVE_TAB === 'tool') { if (e.key !== 'Enter' || document.activeElement.id !== 'tool-next') TOOL.key(e.key); }
  else if (ACTIVE_TAB === 'myth') { if (e.key !== 'Enter' || document.activeElement.id !== 'myth-next') MYTH.key(e.key); }
});
// Leaving the page mid-sim: stop timers
document.addEventListener('visibilitychange', () => { if (document.hidden && SN.on) endSubnet(); });

renderMap();
renderSubnetIntro();
TOOL.intro();
MYTH.intro();

</script>
</body>
